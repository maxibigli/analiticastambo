<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LactIA — Ingresar</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
    --border: rgba(11,11,11,0.10); --accent: #1c5cb8; --critical: #d03b3b;
    --brand-navy: #0f2f5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --muted: #898781;
      --border: rgba(255,255,255,0.10); --accent: #4f97e8; --critical: #e66767;
      --brand-navy: #0b2245;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px;
    background: linear-gradient(180deg, rgba(9,20,38,.55), rgba(9,20,38,.72)),
                url('/static/img/login-bg.jpg') center/cover no-repeat;
    background-attachment: scroll, scroll;
    color: #fff;
  }
  .caja {
    width: 100%; max-width: 340px; margin: 16px; padding: 28px 26px;
    background: rgba(252,252,251,0.94); border: 1px solid rgba(255,255,255,0.25);
    border-top: 3px solid var(--brand-navy); border-radius: 14px;
    color: var(--text-primary);
    box-shadow: 0 18px 48px rgba(0,0,0,.35);
    backdrop-filter: blur(6px);
  }
  @media (prefers-color-scheme: dark) {
    .caja { background: rgba(26,26,25,0.90); }
  }
  .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .marca img { width: 30px; height: 30px; flex-shrink: 0; }
  h1 { margin: 0; font-size: 21px; letter-spacing: -.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--text-secondary); margin: 14px 0 5px; }
  input {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--page); color: var(--text-primary); font-size: 15px;
  }
  button {
    width: 100%; margin-top: 20px; padding: 10px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .error { color: var(--critical); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
  <form class="caja" method="post">
    <div class="marca"><img src="/static/img/logo.svg" alt=""><h1>LactIA</h1></div>
    <div class="sub">Iniciá sesión para continuar.</div>
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" autofocus required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Ingresar</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
